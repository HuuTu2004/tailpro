[workspace]
members = ["crates/log-core", "crates/app-core", "crates/app-protocol", "crates/mcp-adapter", "src-tauri"]
default-members = ["crates/log-core", "crates/app-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
lto = false

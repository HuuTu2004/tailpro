name: Bug report
description: Report a reproducible TailPro problem with a redacted example.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "TailPro is in early development. Please use synthetic or redacted examples. Do not share credentials, private keys, enrollment tokens, or customer logs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example and the relevant source type.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, TailPro revision, OpenSSH/Rust/Node versions as relevant, and local or remote source setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional logs, screenshots, or error messages. Review all attachments before submitting.

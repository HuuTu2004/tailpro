<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TailPro — your servers, your logs, one workspace</title>
  <desc id="desc">A dark banner with mint accents and a schematic workflow: SSH sources, local workspace, log context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C25"/>
      <stop offset="1" stop-color="#0C131B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#BCD6DD" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M57 50L67 60L57 70M76 70H88" stroke="#8DE3C0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="69" fill="#EAF3F6" font-size="25" font-weight="700">TailPro</text>
    <text x="53" y="138" fill="#F2F6F8" font-size="53" font-weight="700" letter-spacing="-1.5">Your servers. Your logs.</text>
    <text x="53" y="198" fill="#8DE3C0" font-size="53" font-weight="700" letter-spacing="-1.5">One workspace.</text>
    <text x="56" y="240" fill="#B3C4CE" font-size="19">A local-first desktop log explorer over SSH.</text>
    <text x="56" y="297" fill="#A3B8C6" font-size="12" letter-spacing="2">RUST / TAURI / REACT / OPENSSH</text>
    <rect x="864" y="45" width="280" height="250" rx="14" fill="#111E28" stroke="#2B414D"/>
    <text x="888" y="74" fill="#A3B8C6" font-size="11" letter-spacing="2">WORKFLOW OVERVIEW</text>
    <g font-size="16" fill="#E1EBF0">
      <rect x="888" y="95" width="232" height="43" rx="7" fill="#162832"/>
      <text x="905" y="122">SSH · Files · Docker</text>
      <path d="M1004 143V157M999 152L1004 157L1009 152" stroke="#8DE3C0" stroke-width="2"/>
      <rect x="888" y="164" width="232" height="43" rx="7" fill="#8DE3C0" fill-opacity=".09" stroke="#8DE3C0" stroke-opacity=".35"/>
      <text x="905" y="191" fill="#BDEEDB">TailPro · Local workspace</text>
      <path d="M1004 212V226M999 221L1004 226L1009 221" stroke="#8DE3C0" stroke-width="2"/>
      <text x="905" y="258">Search · Inspect · Context</text>
    </g>
  </g>
</svg>
